  name: CI/CD Pipeline

  on:
    push:
      branches: [develop, main]
    pull_request:
      branches: [develop, main]

  env:
    PYTHON_VERSION: "3.11"
    COVERAGE_THRESHOLD: 80

  jobs:
    lint:
      name: Lint & Format Check
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip
        - run: pip install ruff black
        - run: ruff check .
        - run: black --check --diff .

    test:
      name: Tests & Coverage
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip
        - name: Install system deps (OCR)
          run: |
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils
        - name: Install Python deps
          run: |
            pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio httpx
        - name: Run tests with coverage
          run: |
            coverage run -m pytest -v --tb=short
            coverage xml
            coverage html
        - name: Check coverage threshold
          run: |
            COV=$(coverage report --format=total)
            echo "Coverage: ${COV}%"
            if [ "$COV" -lt ${{ env.COVERAGE_THRESHOLD }} ]; then
              echo "::error::Coverage ${COV}% below ${{ env.COVERAGE_THRESHOLD }}%"
              exit 1
            fi
        - uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: htmlcov/
            retention-days: 7

    build:
      name: Build Check
      runs-on: ubuntu-latest
      needs: test
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip
        - run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
        - run: python -c "import app; print('✅  App imports OK')"

    notify:
      name: Final Status
      runs-on: ubuntu-latest
      needs: [lint, test, build]
      if: always()
      run: |
        if [ "${{ needs.lint.result }}" = "success" ] && \
           [ "${{ needs.test.result }}" = "success" ] && \
           [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅  All checks passed"
        else
          echo "❌  Some checks failed"; exit 1
        fi
