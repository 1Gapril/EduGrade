name: CI/CD Pipeline

  on:
    push:
      branches: [develop, main]
    pull_request:
      branches: [develop, main]

  env:
    PYTHON_VERSION: "3.11"
    COVERAGE_THRESHOLD: 80

  jobs:
    lint:
      name: Lint & Format Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install ruff black

        - name: Run ruff (lint)
          run: ruff check .

        - name: Run black (format check)
          run: black --check --diff .

    test:
      name: Tests & Coverage
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip

        - name: Install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

        - name: Install Python dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio httpx

        - name: Run tests with coverage
          run: |
            coverage run -m pytest -v --tb=short
            coverage xml
            coverage html

        - name: Check coverage threshold
          run: |
            COVERAGE=$(coverage report --format=total)
            echo "Coverage: ${COVERAGE}%"
            if [ "$COVERAGE" -lt ${{ env.COVERAGE_THRESHOLD }} ]; then
              echo "::error::Coverage ${COVERAGE}% is below ${{
  env.COVERAGE_THRESHOLD }}% threshold"
              exit 1
            fi

        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: htmlcov/
            retention-days: 7

        - name: Upload coverage to Codecov (opcional)
          if: false  # Mude para true se usar Codecov
          uses: codecov/codecov-action@v4
          with:
            files: ./coverage.xml
            fail_ci_if_error: true

    build:
      name: Build Check
      runs-on: ubuntu-latest
      needs: test
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: pip

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt

        - name: Verify imports / syntax
          run: python -c "import app; print('✅  App imports OK')"

    notify:
      name: Notify Status
      runs-on: ubuntu-latest
      needs: [lint, test, build]
      if: always()
      steps:
        - name: Job status
          run: |
            if [ "${{ needs.lint.result }}" == "success" ] && \
               [ "${{ needs.test.result }}" == "success" ] && \
               [ "${{ needs.build.result }}" == "success" ]; then
              echo "✅  All checks passed!"
            else
              echo "❌  Some checks failed"
              exit 1
            fi
