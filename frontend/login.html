<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduGrade</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-gray-50) 100%);
      padding: var(--space-4);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: var(--space-8);
    }
    .login-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--color-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-white);
      font-weight: 700;
      font-size: 1.5rem;
      margin: 0 auto var(--space-4);
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-gray-900);
      margin-bottom: var(--space-1);
    }
    .login-subtitle {
      color: var(--color-gray-500);
      font-size: 0.875rem;
    }
    .login-form .form-group {
      margin-bottom: var(--space-5);
    }
    .login-form .form-label {
      font-size: 0.875rem;
    }
    .login-form .form-input {
      padding: var(--space-3) var(--space-4);
      font-size: 1rem;
    }
    .login-form .btn {
      width: 100%;
      padding: var(--space-3);
      font-size: 1rem;
      margin-top: var(--space-2);
    }
    .login-footer {
      text-align: center;
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-gray-200);
      color: var(--color-gray-500);
      font-size: 0.875rem;
    }
    .login-footer a {
      font-weight: 500;
    }
    @media (max-width: 480px) {
      .login-card {
        padding: var(--space-6);
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo" data-feather="graduation-cap"></div>
        <h1 class="login-title">EduGrade</h1>
        <p class="login-subtitle">Sistema de Gestão e Correção Acadêmica com IA</p>
      </div>

      <form class="login-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Usuário ou Email</label>
          <input type="text" class="form-input" id="username" name="username" placeholder="Digite seu usuário ou email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input type="password" class="form-input" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
          <span data-feather="log-in"></span>
          Entrar
        </button>
      </form>

      <div class="login-footer">
        <p>Não tem conta? <a href="/register.html">Solicite acesso ao administrador</a></p>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      State.init();
      if (api.accessToken && await Auth.init()) {
        if (State.isAuthenticated()) {
          window.location.href = Auth.dashboardPath();
          return;
        }
      }

      const form = document.getElementById('login-form');
      const btn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = form.username.value.trim();
        const password = form.password.value;

        if (!username || !password) {
          UI.showToast('Preencha todos os campos', 'warning');
          return;
        }

        UI.setLoading(btn, true);

        try {
          await Auth.login(username, password);
          UI.showToast('Login realizado com sucesso!', 'success');
          window.location.href = Auth.dashboardPath();
        } catch (error) {
          UI.showToast(error.message || 'Credenciais inválidas', 'error');
        } finally {
          UI.setLoading(btn, false);
        }
      });

    });
  </script>
</body>
</html>
